name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RegistroEstudiantesUIP.sln

      - name: Build Release
        run: dotnet build RegistroEstudiantesUIP.sln -c Release --no-restore

      - name: Publish win-x64
        run: >
          dotnet publish src/RegistroEstudiantesUIP/RegistroEstudiantesUIP.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegistroEstudiantesUIP-win-x64
          path: artifacts/publish/
